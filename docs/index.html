<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partieformular-Leser</title>
<link rel="stylesheet" href="style.css?v=20261113c">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true">♞</span>
    <div>
      <h1 data-t="title">Partieformular → PGN</h1>
      <p class="sub" data-t="subtitle"></p>
    </div>
  </div>
  <div class="lang">
    <button data-lang="de">DE</button><button data-lang="ru">RU</button>
  </div>
</header>

<main>
  <ol class="steps" id="steps">
    <li data-step="1"><span class="dot">1</span><span data-t="s1"></span></li>
    <li data-step="2"><span class="dot">2</span><span data-t="s2"></span></li>
    <li data-step="3"><span class="dot">3</span><span data-t="s3"></span></li>
  </ol>

  <section class="card" id="step-upload">
    <p class="intro" data-t="intro"></p>

    <!-- Selected photos. Built for several photos (2nd page, opponent's sheet); MAX_PHOTOS in app.js is 1 for now. -->
    <div id="selected" class="selected" hidden>
      <h2 data-t="selected"></h2>
      <div id="thumbs" class="thumbs"></div>
    </div>

    <div class="buttons" id="pick-buttons">
      <label class="btn primary" id="camera-btn"><span class="ico" aria-hidden="true">📷</span><span data-t="camera"></span>
        <input type="file" accept="image/*" capture="environment" id="camera" hidden></label>
      <label class="btn" id="file-btn"><span class="ico" aria-hidden="true">🖼️</span><span data-t="upload"></span>
        <input type="file" accept="image/*" id="file" hidden></label>
    </div>

    <div class="buttons" id="send-buttons" hidden>
      <button class="btn primary big" id="send" data-t="send"></button>
      <button class="btn" id="replace" data-t="replace"></button>
    </div>

    <div class="notice" data-t="privacy"></div>
    <p class="hint" data-t="tips"></p>
  </section>

  <section class="card history" id="history" hidden>
    <h2 data-t="history"></h2>
    <ul id="history-list" class="games"></ul>
    <p class="hint" data-t="history_hint"></p>
  </section>

  <section class="card" id="step-busy" hidden>
    <img id="preview-busy" class="preview busy-img" alt="">
    <p class="busy"><span class="spinner"></span><span data-t="busy"></span></p>
  </section>

  <section class="card error" id="step-error" hidden>
    <p id="error-text"></p>
    <button class="btn" id="again-error" data-t="again"></button>
  </section>

  <section id="step-result" hidden>
    <div class="card">
      <h2 data-t="header"></h2>
      <div class="grid">
        <label><span data-t="white"></span><input id="h-white"></label>
        <label><span data-t="black"></span><input id="h-black"></label>
        <label><span data-t="event"></span><input id="h-event"></label>
        <label><span data-t="site"></span><input id="h-site"></label>
        <label><span data-t="date"></span><input id="h-date" placeholder="2026.11.11"></label>
        <label><span data-t="round"></span><input id="h-round"></label>
        <label><span data-t="result"></span>
          <select id="h-result"><option>*</option><option>1-0</option><option>0-1</option><option>1/2-1/2</option></select></label>
      </div>
    </div>

    <div class="card">
      <h2 data-t="moves"></h2>
      <p class="legend">
        <span class="m ok" data-t="l-ok"></span>
        <span class="m fixed" data-t="l-fixed"></span>
        <span class="m doubtful" data-t="l-doubtful"></span>
      </p>
      <div class="split">
        <img id="preview" class="preview" alt="">
        <table class="moves"><tbody id="moves"></tbody></table>
      </div>
      <div id="detail" class="detail" hidden></div>
      <p id="summary" class="hint"></p>
    </div>

    <div class="card">
      <div class="buttons">
        <button class="btn primary" id="download" data-t="download"></button>
        <button class="btn" id="lichess" data-t="lichess"></button>
        <button class="btn" id="copy" data-t="copy"></button>
        <button class="btn" id="again" data-t="again"></button>
      </div>
      <pre id="pgn" class="pgn"></pre>
    </div>
  </section>
</main>
<footer data-t="footer"></footer>
<script src="config.js?v=20261113c"></script>
<!-- Bump ?v= on every change of css/js: phones cache these files and would mix a new page with old code. -->
<script src="app.js?v=20261113c"></script>
</body>
</html>
