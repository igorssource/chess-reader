# Runs the automatic tests on every pull request and on every change of main (no model, no API key needed).
name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q tests
        env:
          MODEL_PROVIDER: fake
      - name: Page scripts are valid JavaScript
        run: for f in docs/*.js docs/old/*.js; do node --check "$f"; done
